name: TestFlight

# Builds a signed release and uploads it to TestFlight.
# Needs repo secrets: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8
# (App Store Connect API key with the Admin role, so Xcode can use cloud-managed signing).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check secrets
        id: check
        run: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::TestFlight upload skipped, missing secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      # App Store Connect requires the iOS 27 SDK (ITMS-90725). Xcode 27 is only on the
      # org's xcode-27 image. Xcode_27.x.app there can be a link to a release candidate,
      # so the real folder's name decides and betas and RCs are never picked.
      - name: Select Xcode 27
        if: steps.check.outputs.ready == 'true'
        run: |
          ls -d /Applications/Xcode*.app || true
          XCODE=$(for x in /Applications/Xcode_*.app; do [ -d "$x" ] && echo "$(cd "$x" && pwd -P)"; done | sort -u | grep -vi -e beta -e release_candidate -e _rc | sort -V | tail -1)
          case "$XCODE" in
            */Xcode_27*) ;;
            *) echo "::error::No stable Xcode 27 on this runner (found: ${XCODE:-none})"; exit 1 ;;
          esac
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Install XcodeGen and generate project
        if: steps.check.outputs.ready == 'true'
        run: |
          brew install xcodegen
          xcodegen generate
          # Build number = run number, written literally so every upload is unique.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" Zaruky/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ZarukyWidgets/Info.plist

      - name: Write API key
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          # Accept the key pasted either as the raw .p8 text or base64 of it.
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY"; then
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY"
          fi
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      # Ad-hoc signed ("-") so the iCloud entitlements are embedded in the archive;
      # the export step below re-signs it with a cloud-managed distribution certificate.
      - name: Archive (ad-hoc signed, with entitlements)
        if: steps.check.outputs.ready == 'true'
        run: |
          xcodebuild archive \
            -project Zaruky.xcodeproj \
            -scheme Zaruky \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Zaruky.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            -quiet
          APP="$RUNNER_TEMP/Zaruky.xcarchive/Products/Applications/Zaruky.app"
          echo "Build number: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")"
          codesign -d --entitlements - "$APP"
          codesign -d --entitlements - "$APP" 2>&1 | grep -q "iCloud.cz.zaruky.app" \
            || { echo "::error::iCloud entitlements missing from the archive"; exit 1; }
          for bundle in "$APP" "$APP/PlugIns/ZarukyWidgets.appex"; do
            codesign -d --entitlements - "$bundle" 2>&1 | grep -q "group.cz.zaruky.app" \
              || { echo "::error::App Group missing from $bundle"; exit 1; }
          done

      # The widget shares data with the app through an App Group. The export below
      # registers the widget's new bundle ID itself, but adds no capability to the
      # app's ID, which already exists.
      - name: Turn on App Groups for the app
        if: steps.check.outputs.ready == 'true'
        run: python3 .github/scripts/asc_capability.py cz.zaruky.app APP_GROUPS

      - name: Sign with cloud signing and upload to TestFlight
        if: steps.check.outputs.ready == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Zaruky.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Clean up key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
